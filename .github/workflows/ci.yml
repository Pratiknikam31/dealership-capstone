name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint Python Files
      run: |
        flake8 server/ --max-line-length=120 --exclude=migrations

  lint-javascript:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install dependencies
      run: |
        npm install -g eslint

    - name: Lint JavaScript Files
      run: |
        eslint server/frontend/src/ --ext .js,.jsx

  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-javascript]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install django djangorestframework django-cors-headers

    - name: Run migrations
      run: |
        cd server
        python manage.py makemigrations
        python manage.py migrate

    - name: Run tests
      run: |
        cd server
        python manage.py test

    - name: Build
      run: |
        echo "Build successful"

    - name: Deploy
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "Deployment step would run here"
